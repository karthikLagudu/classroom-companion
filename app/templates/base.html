<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Classroom Companion{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/css/app.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><span class="brand-mark">CC</span><span>Classroom <strong>Companion</strong></span></a>
    {% if user %}
    <div class="account">
      <span class="account-name">{{ user.name }}</span>
      <form method="post" action="/logout">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button class="ghost-button">Sign out</button>
      </form>
    </div>
    {% endif %}
  </header>
  <main class="shell">
    {% if message %}<div class="flash" role="status">{{ message }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
  <footer>Persistent classroom coordination · Telegram-first · server-authorized</footer>
</body>
</html>
