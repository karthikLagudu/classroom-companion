[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "classroom-companion"
version = "1.0.0"
description = "Telegram-first classroom assignment coordination"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy>=2.0.40,<3",
  "pydantic-settings>=2.10,<3",
  "jinja2>=3.1.6,<4",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
  "openai>=1.100,<3",
  "itsdangerous>=2.2,<3",
  "python-dateutil>=2.9,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "pytest-cov>=6.2,<7", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008"] # FastAPI intentionally evaluates Depends/Form/File in route signatures.

[tool.setuptools.packages.find]
include = ["app*"]
